services:
  family-dashboard:
    build: .
    container_name: family-rhythm
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      TZ: Asia/Shanghai
      DB_PATH: /app/data/family.db
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
